<title>Afazeres MN</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sidebar de visões e categorias + coluna principal (placar, entrada rápida, lista/quadro/matriz) + gaveta de edição à direita */
:root{
  /* Sistema MN · sempre claro: papel, bloco, navy; ciano só na curva da marca */
  color-scheme:light;
  --navy:#0A1528; --ink:#0F1420; --muted:#5B6472; --faint:#8C98AA; --bg:#EFF2F6; --surface:#FFFFFF; --surface-2:#E3EAF2; --line:#DDE2E8;
  --ciano:#00AEE0; --ciano-t:#0891BF;
  --invista:#2F4E8F; --invista-soft:#E3EAF2; --pessoal:#1F9E7A; --pessoal-soft:#E0F2EC;
  --late:#C93838; --late-soft:#F8E5E5; --today:#9C7A12; --today-soft:#F4EEDA; --ok:#12945F;
  --p1:#C93838; --p2:#9C7A12; --p3:#2F4E8F; --p4:#8C98AA;
  --accent:#2F4E8F; --accent-soft:#E3EAF2; --ok-soft:#DFF1E8; --warn:#9C7A12; --warn-soft:#F4EEDA; --bad:#C93838; --bad-soft:#F8E5E5;
  --focus:#0891BF; --shadow:0 1px 2px rgba(10,21,40,.06);
  --f-ui:"Outfit","Segoe UI",Arial,sans-serif;
  --f-num:"JetBrains Mono",Consolas,"Courier New",monospace;
  --r:4px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%;max-width:1440px;margin:0 auto}
/* Sidebar */
.side{border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.brand div{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}
.brand span{font-size:12px;color:var(--muted)}
.navlabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 8px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:4px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--surface);color:var(--navy);box-shadow:inset 2px 0 0 var(--navy);font-weight:600}
.nav .cnt{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--faint)}
.nav .cnt.alert{color:var(--late);font-weight:600}
.nav .sub{padding-left:30px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.pessoal{background:var(--pessoal)} .dot.invista{background:var(--invista)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--faint)}
.side-foot button{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:4px;padding:7px 10px;color:var(--muted)}
.side-foot button:hover{color:var(--ink);border-color:var(--faint)}
.storage{display:flex;align-items:center;gap:6px}
.storage i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.storage.db i{background:var(--ok)}

/* Main */
.main{min-width:0;padding-block:20px 80px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance;color:var(--navy)}
.topbar .date{color:var(--muted);font-size:13px}
.topbar .spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 10px;height:36px;min-width:0;width:240px;color:var(--faint)}
.search input{border:0;background:none;outline:none;width:100%;color:var(--ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:4px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:4px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:0 12px;height:36px;font-weight:600;color:var(--ink)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.btn.danger{color:var(--late)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.mobile-only{display:none}

/* Placar */
.board-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:var(--f-num);font-size:24px;font-weight:600;letter-spacing:-.02em}
.stat .d{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.late .v{color:var(--late)} .stat.today .v{color:var(--today)}
.split{height:6px;border-radius:3px;background:var(--surface-2);display:flex;overflow:hidden;margin-top:6px}
.split i{display:block;height:100%}
.split .p{background:var(--pessoal)} .split .iv{background:var(--invista)}

/* Entrada rápida */
.quick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 10px 8px 12px;display:flex;flex-direction:column;gap:6px}
.quick-row{display:flex;align-items:center;gap:10px}
.quick-row input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:15px;padding:6px 0}
.quick .seg button{padding:4px 9px;font-size:12px}
.quick-hint{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--faint);min-height:22px}
.quick-hint code{font-family:var(--f-num);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.pessoal{background:var(--pessoal-soft);color:var(--pessoal)} .chip.invista{background:var(--invista-soft);color:var(--invista)}
.chip.late{background:var(--late-soft);color:var(--late)} .chip.today{background:var(--today-soft);color:var(--today)}
.chip.kc{background:var(--accent-soft);color:var(--accent);font-weight:600}
.kbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:9px 11px;font-size:13px}
.kbox b{color:var(--accent)}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:4px;color:var(--muted);font-weight:500;text-decoration:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.viewtabs a{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:6px 12px;font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none}

.filterline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.filterline .chip button{border:0;background:none;padding:0;margin-left:2px;color:inherit;display:flex}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r);background:var(--today-soft);color:var(--ink);font-size:13px}
.banner.err{background:var(--late-soft)}
.banner .btn{height:30px;font-size:12px}

/* Lista */
.groups{display:flex;flex-direction:column;gap:20px}
.group h2{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px 4px}
.group h2 .num{font-weight:500;color:var(--faint);letter-spacing:0}
.group.atrasadas h2{color:var(--late)} .group.hoje h2{color:var(--today)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;position:relative}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.row.done .title{text-decoration:line-through;color:var(--faint)}
.check{width:20px;height:20px;border-radius:50%;border:2px solid var(--p4);background:none;margin-top:1px;display:grid;place-items:center;padding:0;color:transparent}
.check[data-p="1"]{border-color:var(--p1)} .check[data-p="2"]{border-color:var(--p2)} .check[data-p="3"]{border-color:var(--p3)}
.check:hover{color:var(--muted)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:12px;height:12px;stroke-width:3}
.row .title{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:12px;color:var(--muted);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg.i{width:13px;height:13px}
.due{font-family:var(--f-num);font-size:12px;text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.due b{font-weight:600}
.due small{color:var(--faint);font-size:11px}
.due.late b{color:var(--late)} .due.today b{color:var(--today)} .due.none{color:var(--faint)}
.tag-ex{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--today);background:var(--today-soft);padding:1px 6px;border-radius:4px}
.stale{color:var(--today)}

/* Quadro */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col h3{margin:2px 4px 4px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.col.over{outline:2px dashed var(--focus);outline-offset:-4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 11px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card .title{font-weight:500;overflow-wrap:anywhere}
.card.dragging{opacity:.5}
.card .meta{margin-top:0}
.card-top{display:flex;gap:8px;align-items:flex-start}
.pbar{width:3px;align-self:stretch;border-radius:2px;background:var(--p4)}
.pbar[data-p="1"]{background:var(--p1)} .pbar[data-p="2"]{background:var(--p2)} .pbar[data-p="3"]{background:var(--p3)}

/* Matriz */
.matrix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quad{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:160px;display:flex;flex-direction:column;gap:8px;min-width:0}
.quad header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.quad header b{font-size:15px;font-weight:700}
.quad header small{font-size:12px;color:var(--faint)}
.quad.q1{border-top:3px solid var(--late)} .quad.q2{border-top:3px solid var(--invista)} .quad.q3{border-top:3px solid var(--today)} .quad.q4{border-top:3px solid var(--faint)}
.mini{display:flex;gap:8px;align-items:center;padding:6px 4px;border-radius:4px;cursor:pointer;min-width:0}
.mini:hover{background:var(--surface-2)}
.mini .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .num{font-size:11.5px;color:var(--muted)}
.mini .num.late{color:var(--late)}

/* Vazio */
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 24px;display:grid;gap:14px;max-width:720px}
.empty h3{margin:0;font-size:18px;font-weight:700}
.empty p{margin:0;color:var(--muted);max-width:62ch}
.syntax{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.syntax code{font-family:var(--f-num);font-size:12px;background:var(--surface-2);padding:2px 6px;border-radius:4px;justify-self:start}
.syntax span{color:var(--muted)}

/* Gaveta */
.scrim{position:fixed;inset:0;background:rgba(10,14,26,.36);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;box-shadow:-10px 0 40px rgba(10,14,26,.18);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header .saved{font-size:12px;color:var(--faint);margin-right:auto}
.drawer .body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.drawer .body>*{flex:none}
.drawer footer{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f-title{font-size:19px;font-weight:700;border:0;outline:none;background:none;width:100%;resize:none;padding:0;line-height:1.3}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:8px 10px;width:100%;min-width:0;outline:none}
.inp:focus{border-color:var(--focus)}
textarea.inp{min-height:90px;resize:vertical}
.seg.full{display:flex} .seg.full button{flex:1;justify-content:center}
.seg button.pessoal[aria-pressed="true"]{color:var(--pessoal)} .seg button.invista[aria-pressed="true"]{color:var(--invista)}
.chk-list{display:flex;flex-direction:column;gap:4px}
.chk-item{display:flex;align-items:center;gap:8px;border-radius:4px;background:var(--surface)}
.chk-item.dragging{background:var(--surface-2);box-shadow:0 2px 10px rgba(10,21,40,.15);position:relative;z-index:2}
.grip{width:22px;height:28px;display:grid;place-items:center;color:var(--faint);cursor:grab;touch-action:none;background:none;border:0;padding:0;flex:none;border-radius:4px}
.grip:hover,.grip:focus-visible{color:var(--navy);background:var(--surface-2)}
.chk-item.dragging .grip{cursor:grabbing;color:var(--navy)}
.grip svg{width:14px;height:14px}
.pchip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--navy);background:var(--surface)}
.people-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.people-pick button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;padding:5px 10px;font-weight:500;font-size:13px}
.people-pick button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.people-pick input{border:1px dashed var(--line);background:none;border-radius:4px;padding:5px 8px;font-size:13px;width:130px;outline:none}
.people-pick input:focus{border-color:var(--focus)}
.catseg{display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface);align-self:flex-start;max-width:100%}
.catseg button{border:0;border-left:1px solid var(--line);background:none;padding:8px 16px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.catseg button:first-child{border-left:0}
.catseg button .num{font-size:12px;font-weight:500;color:var(--faint)}
.catseg button[aria-pressed="true"]{background:var(--navy);color:var(--bg)}
.catseg button[aria-pressed="true"] .num{color:var(--bg);opacity:.8}
.catseg .dot{width:8px;height:8px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.subtabs .lbl2{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-right:2px}
.subtabs button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:5px 10px;font-weight:500;font-size:13px;white-space:nowrap}
.subtabs button .num{font-size:11px;color:var(--faint)}
.subtabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.subtabs button[aria-pressed="true"] .num{color:var(--bg);opacity:.8}
.subtabs .dot{width:7px;height:7px}
.subtabs:empty{display:none}
@media (max-width:900px){.subtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}.subtabs::-webkit-scrollbar{display:none}.subtabs button,.subtabs .lbl2{flex:none}}
@media (max-width:520px){.catseg{align-self:stretch}.catseg button{flex:1;justify-content:center;padding:8px 6px}}
.peopletabs{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.peopletabs::-webkit-scrollbar{display:none}
.peopletabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--navy);border-radius:4px;padding:5px 10px;font-weight:600;font-size:12.5px;white-space:nowrap}
.peopletabs button .num{font-size:11px;color:var(--faint);font-weight:500}
.peopletabs button[aria-current="true"]{background:var(--navy);border-color:var(--navy);color:var(--bg)}
.peopletabs button[aria-current="true"] .num{color:var(--bg)}
.peopletabs .lbl2{flex:none;align-self:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-right:2px}
.chk-item input[type=text]{flex:1;border:0;background:none;outline:none;padding:4px 0;min-width:0}
.chk-item input[type=text].done{text-decoration:line-through;color:var(--faint)}
.chk-item button:not(.check):not(.grip){background:none;border:0;color:var(--faint);padding:2px;display:flex}
.audit{font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:3px 12px;background:var(--bg);border-radius:4px;padding:10px 12px}
.audit .num{color:var(--ink)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--late)}

/* Modal configurações */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:4px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.modal h2{margin:0;font-size:18px}
.modal h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:8px}
.subedit{display:flex;flex-direction:column;gap:6px}
.subedit .r{display:flex;gap:6px;align-items:center}
.subedit .r .inp{padding:6px 9px}
.subedit .r small{font-family:var(--f-num);color:var(--faint);min-width:26px;text-align:right}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.help{font-size:12.5px;color:var(--muted);margin:0}

/* Toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:4px;padding:9px 10px 9px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);font-size:13px}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:2px 4px}

.fab{display:none}
.viewtabs{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.viewtabs::-webkit-scrollbar{display:none}
.viewtabs button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;padding:6px 12px;font-weight:500;font-size:13px;white-space:nowrap}
.viewtabs button .num{font-size:11.5px;color:var(--faint)}
.viewtabs button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.viewtabs button[aria-current="true"] .num{color:var(--bg);opacity:.75}

@media (max-width:900px){

  .side.open{transform:none;box-shadow:var(--shadow)}

  .peopletabs{display:flex}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .board-stats{grid-template-columns:repeat(2,minmax(0,1fr))}

  .search{width:100%;order:5}
  .topbar h1{font-size:22px}
  .matrix{grid-template-columns:minmax(0,1fr)}

@media (max-width:520px){

<script>
(() => {
'use strict';
const TZ = 'America/Sao_Paulo';
const LS_KEY = 'pauta.v1';
const UI_KEY = 'pauta.ui.v2';
const CATS = { pessoal: 'Pessoal', invista: 'Invista' };
const STATUS = { todo: 'A fazer', doing: 'Em andamento', waiting: 'Aguardando terceiros', done: 'Concluída' };
const PRIO = { 1: 'P1 crítica', 2: 'P2 alta', 3: 'P3 normal', 4: 'P4 baixa' };
const RECUR = { none: 'Não repete', daily: 'Todo dia', weekdays: 'Dias úteis (seg a sex)', weekly: 'Toda semana', monthly: 'Todo mês', yearly: 'Todo ano' };
const ESTIM = { '': 'Sem estimativa', 15: '15 min', 30: '30 min', 60: '1 h', 120: '2 h', 240: '4 h', 480: '1 dia' };
const DEFAULT_PEOPLE = [['pedro-felipe','Pedro Felipe'],['eric','Eric'],['lucas','Lucas'],['buy-side','Buy Side'],['juridico','Jurídico'],['investimentos','Investimentos'],['ppa','PPA']];
const DEFAULT_SUBS = {
  pessoal: [['saude','Saúde e treino'],['familia','Família'],['financas','Finanças e investimentos'],['casa','Casa e burocracia'],['carreira','Carreira e estudo']],
  invista: [['originacao','Originação'],['diligencia','Due diligence'],['recuperacao','Cobrança e recuperação'],['juridico','Jurídico'],['comite','Comitê e aprovações'],['investidores','Investidores e relatórios'],['gestao','Gestão e equipe']]
};
const VIEWS = [
  ['abertas','Tudo em uma lista','Todas as abertas numa lista só, por prioridade e prazo'],
  ['foco','Foco de hoje','Atrasadas, de hoje e P1 sem data'],
  ['semana','Próximos 7 dias','Vencem até D+7'],
  ['aguardando','Aguardando terceiros','Bola com outra pessoa'],
  ['semdata','Sem data','Abertas sem vencimento'],
  ['concluidas','Concluídas','Histórico de entregas']
];
const ICON = {
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  repeat:'<svg class="i" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>',
  wait:'<svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 11-5.7"/><circle cx="18" cy="17" r="4"/><path d="M18 15.5V17l1 1"/></svg>',
  list:'<svg class="i" viewBox="0 0 24 24"><path d="M9 11l2 2 4-4"/><rect x="3" y="3" width="18" height="18" rx="3"/></svg>',
  note:'<svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  clock:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  link:'<svg class="i" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  copy:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  tag:'<svg class="i" viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>'
};

/* ---------- datas (sempre no fuso de Brasília) ---------- */
const fmtISO = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const todayISO = () => fmtISO.format(new Date());
const toUTC = iso => { const [y,m,d] = iso.split('-').map(Number); return Date.UTC(y,m-1,d); };
const fromUTC = ms => new Date(ms).toISOString().slice(0,10);
const addDays = (iso,n) => fromUTC(toUTC(iso) + n*864e5);
const diffDays = (a,b) => Math.round((toUTC(a) - toUTC(b))/864e5);
const weekday = iso => new Date(toUTC(iso)).getUTCDay();
const addMonths = (iso,n) => { const [y,m,d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y,m-1+n,1)); const last = new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate(); t.setUTCDate(Math.min(d,last)); return t.toISOString().slice(0,10); };
const fmtWd = new Intl.DateTimeFormat('pt-BR',{timeZone:'UTC',weekday:'short'});
const fmtLong = new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtStamp = new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const shortDate = iso => fmtWd.format(new Date(toUTC(iso))).replace(/\./g,'') + ' ' + iso.slice(8,10) + '/' + iso.slice(5,7) + (iso.slice(0,4) !== todayISO().slice(0,4) ? '/' + iso.slice(2,4) : '');
const stamp = ts => ts ? fmtStamp.format(new Date(ts)).replace(',', '') : '';
const isoOfStamp = ts => fmtISO.format(new Date(ts));
const dLabel = n => n === 0 ? 'D0' : (n > 0 ? 'D+' + n : 'D' + n);

/* ---------- utilidades ---------- */
const $ = (s,r=document) => r.querySelector(s);
const $$ = (s,r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const uid = p => (p||'t') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const slug = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40) || uid('s');
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e) { return false; } };
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- estado ---------- */
const S = { tasks: new Map(), config: defaultConfig(), mode: 'init', loaded: false, banner: null };
const savedUI = lsGet(UI_KEY) || {};
const FKEYS = ['cats','subs','people','prios','status','due','extra'];
const emptyF = () => Object.fromEntries(FKEYS.map(k => [k, []]));
const F = (() => { const f = emptyF(); const sf = savedUI.f || {}; for (const k of FKEYS) if (Array.isArray(sf[k])) f[k] = sf[k]; return f; })();
const UI = { view: savedUI.view || 'abertas', layout: savedUI.layout || 'lista', q: '', quickCat: savedUI.quickCat || 'invista' };
const persistUI = () => lsSet(UI_KEY, { view: UI.view, f: F, layout: UI.layout, quickCat: UI.quickCat });
const fCount = () => FKEYS.reduce((n,k) => n + F[k].length, 0);
const oneSub = () => { if (F.subs.length !== 1) return null; const [cat, sub] = F.subs[0].split(':'); return sub === '__none' ? null : { cat, sub }; };
const oneCat = () => F.cats.length === 1 ? F.cats[0] : (oneSub() ? oneSub().cat : null);
const onePerson = () => F.people.length === 1 ? F.people[0] : null;
const DUE_OPTS = [['atrasadas','Atrasadas'],['hoje','Hoje'],['semana','Próximos 7 dias'],['semdata','Sem data']];
const EXTRA_OPTS = [['comite','Na Pauta Comitê'],['checklist','Checklist pendente'],['recorrente','Recorrentes']];
const STATUS_OPTS = [['todo','A fazer'],['doing','Em andamento'],['waiting','Aguardando terceiros']];

function defaultConfig(){
  const subs = {};
  for (const c of Object.keys(DEFAULT_SUBS)) subs[c] = DEFAULT_SUBS[c].map(([id,name]) => ({id,name}));
  return { subs, people: DEFAULT_PEOPLE.map(([id,name]) => ({id,name})) };
}
function normalizeConfig(c){
  const d = defaultConfig();
  if (!c || !c.subs) return d;
  for (const k of Object.keys(CATS)) if (Array.isArray(c.subs[k])) d.subs[k] = c.subs[k].filter(s => s && s.id && s.name).map(s => ({id:String(s.id), name:String(s.name)}));
  if (Array.isArray(c.people)) d.people = c.people.filter(x => x && x.id && x.name).map(x => ({id:String(x.id), name:String(x.name)}));
  return d;
}
const personName = id => S.config.people.find(x => x.id === id)?.name || '';
function normalizeTask(t, id){
  return {
    id: id || t.id || uid(),
    title: String(t.title || '(sem título)'),
    notes: String(t.notes || ''),
    cat: CATS[t.cat] ? t.cat : 'pessoal',
    sub: t.sub ? String(t.sub) : '',
    priority: [1,2,3,4].includes(+t.priority) ? +t.priority : 3,
    status: STATUS[t.status] ? t.status : 'todo',
    createdAt: t.createdAt || new Date().toISOString(),
    updatedAt: t.updatedAt || t.createdAt || new Date().toISOString(),
    due: /^\d{4}-\d{2}-\d{2}$/.test(t.due||'') ? t.due : '',
    dueTime: /^\d{2}:\d{2}$/.test(t.dueTime||'') ? t.dueTime : '',
    doneAt: t.doneAt || '',
    waitingOn: String(t.waitingOn || ''),
    estimate: t.estimate ? +t.estimate : 0,
    tags: Array.isArray(t.tags) ? t.tags.map(String).filter(Boolean) : [],
    checklist: Array.isArray(t.checklist) ? t.checklist.map(c => ({id:c.id||uid('c'), text:String(c.text||''), done:!!c.done})) : [],
    recur: RECUR[t.recur] ? t.recur : 'none',
    link: String(t.link || ''),
    people: Array.isArray(t.people) ? [...new Set(t.people.map(String).filter(Boolean))] : [],
    example: !!t.example
  };
}
const subName = (cat, id) => (S.config.subs[cat] || []).find(s => s.id === id)?.name || '';
const isOpen = t => t.status !== 'done';

/* ---------- armazenamento: banco do artefato, com fallback local ---------- */
const Store = {
  db: null, chains: new Map(), downloads: null,
  async start(){
    let db = null, user = null;
    const c = window.claude;
    if (c && typeof c.use === 'function') {
      try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch(e) {}
      c.use('downloads').then(d => { Store.downloads = d; }).catch(() => {});
    }
    let owner = true;
    if (db && user) { try { owner = await user.isOwner(); } catch(e) {} }
    if (db && owner) return this.startDb(db);
    if (db && !owner) setBanner('Esta pauta é privada do dono. Você está vendo uma cópia local vazia, salva só neste navegador.', 'warn');
    this.startLocal();
  },
  startLocal(){
    S.mode = 'local';
    const saved = lsGet(LS_KEY);
    if (saved) {
      S.config = normalizeConfig(saved.config);
      S.tasks = new Map((saved.tasks || []).map(t => { const n = normalizeTask(t); return [n.id, n]; }));
    }
    S.loaded = true; render();
  },
  persistLocal(){
    if (S.mode !== 'local') return;
    if (!lsSet(LS_KEY, { config: S.config, tasks: [...S.tasks.values()] })) toast('Não consegui salvar neste navegador. Exporte um backup.');
  },
  startDb(db){
    S.mode = 'db'; this.db = db; render();
    const timer = setTimeout(() => { if (!S.loaded) setBanner('O banco ainda não respondeu. Seus dados aparecem assim que a conexão voltar.', 'warn'); }, 10000);
    db.collection('tasks').onSnapshot(snap => {
      S.tasks = new Map(snap.docs.map(d => [d.id, normalizeTask(d.data(), d.id)]));
      if (!snap.metadata.fromCache) { clearTimeout(timer); if (!S.loaded) { S.loaded = true; if (S.banner && S.banner.kind === 'warn') setBanner(null); } }
      render(); refreshDrawerAudit();
    }, err => {
      clearTimeout(timer); S.loaded = true;
      setBanner('Perdi a conexão com o banco (' + (err && err.code || 'erro') + '). Recarregue a página para reconectar.', 'err');
      render();
    });
    db.doc('config/main').onSnapshot(snap => {
      if (snap.exists) { S.config = normalizeConfig(snap.data()); render(); }
    }, () => {});
  },
  queue(key, fn){
    const prev = this.chains.get(key) || Promise.resolve();
    const next = prev.then(fn).catch(e => {
      const code = e && e.code;
      toast(code === 'quota_exceeded' ? 'Limite de armazenamento atingido. Apague concluídas antigas.' : 'Não consegui salvar (' + (code || 'erro') + '). Tente de novo.');
    });
    this.chains.set(key, next);
    return next;
  },
  saveTask(t){
    t.updatedAt = new Date().toISOString();
    S.tasks.set(t.id, t);
    if (S.mode === 'db') { const body = clone(t); delete body.id; this.queue('t:'+t.id, () => this.db.collection('tasks').doc(t.id).set(body)); }
    else this.persistLocal();
    render();
  },
  deleteTask(id){
    S.tasks.delete(id);
    if (S.mode === 'db') this.queue('t:'+id, () => this.db.collection('tasks').doc(id).delete());
    else this.persistLocal();
    render();
  },
  saveConfig(){
    if (S.mode === 'db') this.queue('config', () => this.db.doc('config/main').set(clone(S.config)));
    else this.persistLocal();
    render();
  }
};

/* ---------- entrada rápida ---------- */
const WD = {dom:0,domingo:0,seg:1,segunda:1,'segunda-feira':1,ter:2,terca:2,'terca-feira':2,qua:3,quarta:3,'quarta-feira':3,qui:4,quinta:4,'quinta-feira':4,sex:5,sexta:5,'sexta-feira':5,sab:6,sabado:6};
const RECUR_WORDS = {diario:'daily',diaria:'daily',uteis:'weekdays',semanal:'weekly',mensal:'monthly',anual:'yearly'};
function findSub(q, cat){
  const nq = norm(q).replace(/-/g,' ');
  const cats = cat ? [cat] : Object.keys(CATS);
  for (const c of cats) for (const s of S.config.subs[c]) if (norm(s.name).startsWith(nq) || norm(s.id).startsWith(nq)) return { cat: c, sub: s.id };
  for (const c of cats) for (const s of S.config.subs[c]) if (norm(s.name).includes(nq)) return { cat: c, sub: s.id };
  return null;
}
function parseQuick(text){
  const out = { people: [], cat: null, sub: '', priority: 0, due: '', dueTime: '', waitingOn: '', recur: '', tags: [], subMiss: '' };
  const today = todayISO(); const keep = []; let subQ = '';
  for (const tk of text.trim().split(/\s+/).filter(Boolean)) {
    const n = norm(tk); let m;
    if ((m = n.match(/^#(p|pessoal|i|inv|invista)(?:\/(.+))?$/))) { out.cat = m[1][0] === 'p' ? 'pessoal' : 'invista'; if (m[2]) subQ = m[2]; continue; }
    if ((m = n.match(/^\/(.+)$/))) { subQ = m[1]; continue; }
    if ((m = n.match(/^!([1-4])$/))) { out.priority = +m[1]; continue; }
    if ((m = n.match(/^@(.+)$/))) { const q = m[1].replace(/[-_]/g,' '); const pp = S.config.people.find(x => norm(x.name).startsWith(q) || norm(x.id).replace(/-/g,' ').startsWith(q)); if (pp) { if (!out.people.includes(pp.id)) out.people.push(pp.id); } else out.waitingOn = tk.slice(1).replace(/_/g,' '); continue; }
    if ((m = n.match(/^\*(.+)$/)) && RECUR_WORDS[m[1]]) { out.recur = RECUR_WORDS[m[1]]; continue; }
    if (n === 'hoje') { out.due = today; continue; }
    if (n === 'amanha') { out.due = addDays(today,1); continue; }
    if (n in WD) { let d = (WD[n] - weekday(today) + 7) % 7; if (d === 0) d = 7; out.due = addDays(today, d); continue; }
    if ((m = n.match(/^\+(\d{1,3})(d|s|m)?$/))) { const k = +m[1]; out.due = m[2] === 'm' ? addMonths(today,k) : addDays(today, m[2] === 's' ? k*7 : k); continue; }
    if ((m = n.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/))) {
      const dd = +m[1], mm = +m[2]; let yy = m[3] ? +m[3] : +today.slice(0,4); if (yy < 100) yy += 2000;
      if (dd>=1 && dd<=31 && mm>=1 && mm<=12) { let iso = `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`; if (!m[3] && diffDays(iso, today) < -60) iso = `${yy+1}${iso.slice(4)}`; out.due = iso; continue; }
    }
    keep.push(tk);
  }
  if (subQ) { const f = findSub(subQ, out.cat); if (f) { out.cat = f.cat; out.sub = f.sub; } else out.subMiss = subQ; }
  out.title = keep.join(' ');
  return out;
}
function quickHint(){
  const v = $('#quick-input').value;
  const box = $('#quick-hint');
  if (!v.trim()) {
    box.innerHTML = '';
    return;
  }
  const p = parseQuick(v); const cat = p.cat || UI.quickCat; const parts = [];
  parts.push(`<span class="chip ${cat}"><i class="dot ${cat}"></i>${esc(CATS[cat])}${p.sub ? ' · ' + esc(subName(cat,p.sub)) : ''}</span>`);
  if (p.subMiss) parts.push(`<span class="chip late">Subcategoria "${esc(p.subMiss)}" não existe</span>`);
  if (p.priority) parts.push(`<span class="chip">P${p.priority}</span>`);
  if (p.due) { const d = diffDays(p.due, todayISO()); parts.push(`<span class="chip ${d<0?'late':d===0?'today':''}">${esc(shortDate(p.due))} · <span class="num">${dLabel(d)}</span></span>`); }
  for (const id of p.people) parts.push(`<span class="pchip">${esc(personName(id))}</span>`);
  if (p.waitingOn) parts.push(`<span class="chip">${ICON.wait}Aguardando ${esc(p.waitingOn)}</span>`);
  if (p.recur) parts.push(`<span class="chip">${ICON.repeat}${esc(RECUR[p.recur])}</span>`);
  box.innerHTML = parts.join('');
}
function addQuick(e){
  e.preventDefault();
  const input = $('#quick-input'); const p = parseQuick(input.value);
  if (!p.title) { toast('Escreva o que precisa ser feito.'); return; }
  const cat = p.cat || UI.quickCat;
  const t = normalizeTask({
    title: p.title, cat, sub: p.sub || (oneSub() && oneSub().cat === cat ? oneSub().sub : ''), priority: p.priority || 3,
    due: p.due, people: p.people.length ? p.people : (onePerson() ? [onePerson()] : []), waitingOn: p.waitingOn, status: p.waitingOn ? 'waiting' : 'todo',
    recur: p.recur || 'none', createdAt: new Date().toISOString()
  });
  Store.saveTask(t);
  input.value = ''; quickHint();
  const visible = filtered().some(x => x.id === t.id);
  toast(visible ? 'Tarefa adicionada.' : 'Tarefa adicionada em outra visão.', visible ? null : { label: 'Abrir', fn: () => openDrawer(t.id) });
}

/* ---------- filtros e agrupamento ---------- */
function subMatch(t, k){ const [c, s] = k.split(':'); return t.cat === c && (s === '__none' ? (!t.sub || !subName(c, t.sub)) : t.sub === s); }
function dueMatch(t, k, today){
  if (k === 'semdata') return !t.due;
  if (!t.due) return false;
  const d = diffDays(t.due, today);
  return k === 'atrasadas' ? d < 0 : k === 'hoje' ? d === 0 : d > 0 && d <= 7;
}
function inCatScope(t){
  const today = todayISO();
  if ((F.cats.length || F.subs.length) && !(F.cats.includes(t.cat) || F.subs.some(k => subMatch(t, k)))) return false;
  if (F.people.length && !F.people.some(id => t.people.includes(id))) return false;
  if (F.prios.length && !F.prios.includes(t.priority)) return false;
  if (F.status.length && !F.status.includes(t.status)) return false;
  if (F.due.length && !F.due.some(k => dueMatch(t, k, today))) return false;
  for (const x of F.extra) {

function renderMatrix(el, list){

/* ---------- concluir, recorrência, desfazer ---------- */
function nextDue(t){
  const base = t.due || todayISO();
  switch (t.recur) {
    case 'daily': return addDays(base,1);
    case 'weekdays': { let d = addDays(base,1); while ([0,6].includes(weekday(d))) d = addDays(d,1); return d; }
    case 'weekly': return addDays(base,7);
    case 'monthly': return addMonths(base,1);
    case 'yearly': return addMonths(base,12);
  }
  return '';
}
function toggleDone(id){
  const t = S.tasks.get(id); if (!t) return;
  const before = clone(t);
  if (isOpen(t)) {
    t.prevStatus = t.status; t.status = 'done'; t.doneAt = new Date().toISOString();
    let spawned = null;
    if (t.recur !== 'none') {
      spawned = normalizeTask({ ...clone(t), id: uid(), status: 'todo', doneAt: '', due: nextDue(t), createdAt: new Date().toISOString(), checklist: t.checklist.map(c => ({...c, done:false})), example: false });
      t.recur = 'none';
    }
    Store.saveTask(t);
    if (spawned) Store.saveTask(spawned);
    toast(spawned ? `Concluída. Próxima em ${shortDate(spawned.due)}.` : 'Concluída.', { label: 'Desfazer', fn: () => { Store.saveTask(normalizeTask(before)); if (spawned) Store.deleteTask(spawned.id); } });
  } else {
    t.status = before.prevStatus && before.prevStatus !== 'done' ? before.prevStatus : 'todo'; t.doneAt = '';
    Store.saveTask(t); toast('Reaberta.');
  }
  if (Drawer.id === id) openDrawer(id);
}

function bindDrawer(){
  const root = $('#drawer-root');
  root.addEventListener('pointerdown', e => {
    const g = e.target.closest('[data-grip]'); if (!g || !Drawer.draft) return;
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    const list = $('#chk-list'); const item = g.closest('.chk-item'); const body = root.querySelector('.body');
    let moved = false; item.classList.add('dragging');
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
    const onMove = ev => {
      const y = ev.clientY; const prev = item.previousElementSibling, next = item.nextElementSibling;
      if (prev) { const r = prev.getBoundingClientRect(); if (y < r.top + r.height / 2) { list.insertBefore(item, prev); moved = true; } }
      if (next) { const r = next.getBoundingClientRect(); if (y > r.top + r.height / 2) { list.insertBefore(next, item); moved = true; } }
      if (body) { const br = body.getBoundingClientRect(); if (y < br.top + 40) body.scrollTop -= 10; else if (y > br.bottom - 40) body.scrollTop += 10; }
    };
    const onUp = () => {
      g.removeEventListener('pointermove', onMove); g.removeEventListener('pointerup', onUp); g.removeEventListener('pointercancel', onUp);
      item.classList.remove('dragging');
      if (!moved || !Drawer.draft) return;
      const order = $$('#chk-list .chk-item').map(x => x.dataset.cid);
      const byId = new Map(Drawer.draft.checklist.map(c => [c.id, c]));
      Drawer.draft.checklist = order.map(id => byId.get(id)).filter(Boolean);
      flushDrawer();
    };
    g.addEventListener('pointermove', onMove); g.addEventListener('pointerup', onUp); g.addEventListener('pointercancel', onUp);
  });
  root.addEventListener('input', e => {
    const d = Drawer.draft; if (!d) return; const el = e.target;
    if (el.id === 'f-title') d.title = el.value.replace(/\n/g,' ');
    else if (el.id === 'f-notes') d.notes = el.value;
    else if (el.id === 'f-wait') d.waitingOn = el.value;
    else if (el.id === 'f-tags') d.tags = el.value.split(',').map(s => s.trim().replace(/^#/,'')).filter(Boolean);
    else if (el.id === 'f-link') d.link = el.value.trim();
    else if (el.dataset.chktext) { const c = d.checklist.find(c => c.id === el.dataset.chktext); if (c) c.text = el.value; }
    else return;
    scheduleSave();
  });
  root.addEventListener('change', e => {
    const d = Drawer.draft; if (!d) return; const el = e.target;
    if (el.id === 'f-sub') { if (el.value === '__new') { const n = $('#f-newsub'); n.hidden = false; n.focus(); return; } d.sub = el.value; }
    else if (el.id === 'f-status') { const was = d.status; d.status = el.value; if (el.value === 'done' && was !== 'done') d.doneAt = new Date().toISOString(); if (el.value !== 'done') d.doneAt = ''; }
    else if (el.id === 'f-due') d.due = el.value;
    else if (el.id === 'f-time') { d.dueTime = el.value; if (el.value && !d.due) { d.due = todayISO(); $('#f-due').value = d.due; } }
    else if (el.id === 'f-recur') d.recur = el.value;
    else if (el.id === 'f-est') d.estimate = +el.value || 0;
    else return;
    flushDrawer();
  });
  root.addEventListener('keydown', e => {
    const d = Drawer.draft; if (!d) return;
    if (e.target.id === 'f-title' && e.key === 'Enter') { e.preventDefault(); flushDrawer(); }
    if (e.target.id === 'f-newperson' && e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; const id = addPerson(v); if (!d.people.includes(id)) d.people.push(id); flushDrawer(); renderDrawer(); $('#f-newperson') && $('#f-newperson').focus(); return; }
    if (e.target.dataset.grip && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); const id = e.target.dataset.grip; const i = d.checklist.findIndex(c => c.id === id); const j = i + (e.key === 'ArrowUp' ? -1 : 1); if (i < 0 || j < 0 || j >= d.checklist.length) return; const [it] = d.checklist.splice(i,1); d.checklist.splice(j,0,it); flushDrawer(); renderDrawer(); const g = $(`[data-grip="${id}"]`); g && g.focus(); return; }
    if (e.target.id === 'f-chk-new' && e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; d.checklist.push({ id: uid('c'), text: v, done: false }); flushDrawer(); renderDrawer(); $('#f-chk-new').focus(); }
    if (e.target.id === 'f-newsub' && e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; const id = addSub(d.cat, v); d.sub = id; flushDrawer(); renderDrawer(); }
  });
  root.addEventListener('click', e => {
    const d = Drawer.draft; if (!d) return;
    const t = e.target.closest('button,[data-close]'); if (!t) return;
    if (t.hasAttribute('data-close')) return closeDrawer();
    if (t.dataset.setcat) { if (d.cat !== t.dataset.setcat) { d.cat = t.dataset.setcat; d.sub = ''; flushDrawer(); renderDrawer(); } return; }
    if (t.dataset.setprio) { d.priority = +t.dataset.setprio; flushDrawer(); renderDrawer(); return; }
    if (t.dataset.quickdue !== undefined) { d.due = t.dataset.quickdue === '' ? '' : addDays(todayISO(), +t.dataset.quickdue); if (!d.due) d.dueTime = ''; flushDrawer(); renderDrawer(); return; }
    if (t.dataset.chk) { const c = d.checklist.find(c => c.id === t.dataset.chk); if (c) c.done = !c.done; flushDrawer(); renderDrawer(); return; }
    if (t.dataset.chkdel) { d.checklist = d.checklist.filter(c => c.id !== t.dataset.chkdel); flushDrawer(); renderDrawer(); return; }
    if (t.dataset.setperson) { const id = t.dataset.setperson; d.people = d.people.includes(id) ? d.people.filter(x => x !== id) : [...d.people, id]; flushDrawer(); t.setAttribute('aria-pressed', String(d.people.includes(id))); return; }
    if (t.id === 'd-tocomite') { flushDrawer(); const task = S.tasks.get(d.id); if (!task || !MN.comite) return; const c = MN.comite.addFromTask(task, $('#f-kweek').value); $('#d-comite').innerHTML = comiteBlock(d); toast('Pautado: ' + MN.comite.label(c) + '.', { label: 'Abrir', fn: () => MN.comite.open(c.id) }); return; }
    if (t.dataset.opencase) { const id = t.dataset.opencase; closeDrawer(); MN.comite.open(id); return; }
    if (t.id === 'd-done') { flushDrawer(); toggleDone(d.id); return; }
    if (t.id === 'd-del') { Drawer.confirmDel = true; renderDrawer(); return; }
    if (t.id === 'd-del-no') { Drawer.confirmDel = false; renderDrawer(); return; }
    if (t.id === 'd-del-yes') { const snap = clone(S.tasks.get(d.id) || d); clearTimeout(Drawer.timer); Drawer.draft = null; Drawer.id = null; $('#drawer-root').innerHTML = ''; Store.deleteTask(snap.id); toast('Tarefa apagada.', { label: 'Desfazer', fn: () => Store.saveTask(normalizeTask(snap)) }); return; }
    if (t.id === 'd-dup') { flushDrawer(); const c = normalizeTask({ ...clone(d), id: uid(), title: d.title + ' (cópia)', status: 'todo', doneAt: '', createdAt: new Date().toISOString(), example: false }); Store.saveTask(c); openDrawer(c.id); toast('Cópia criada.'); return; }
  });
}

function addSub(cat, name){
  let id = slug(name); const ids = new Set(S.config.subs[cat].map(s => s.id));
  while (ids.has(id)) id = id + '-2';
  S.config.subs[cat].push({ id, name }); Store.saveConfig(); return id;
}
function addPerson(name){
  const ex = S.config.people.find(x => norm(x.name) === norm(name)); if (ex) return ex.id;
  let id = slug(name); const ids = new Set(S.config.people.map(x => x.id)); while (ids.has(id)) id = id + '-2';
  S.config.people.push({ id, name }); Store.saveConfig(); return id;
}

function bindSettings(){

function toCSV(){
  const cols = ['titulo','categoria','subcategoria','pessoas','status','prioridade','criada_em','vencimento','concluida_em','aguardando','repeticao','checklist','notas'];

async function exportFile(filename, data){
  if (Store.downloads) {
    try { await Store.downloads.save({ filename, data }); toast('Arquivo salvo.'); }
    catch (e) { if (e && e.code !== 'declined') toast('Não consegui gerar o arquivo (' + (e.code || 'erro') + ').'); }
    return;
  }
  if (!window.claude) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return;
  }
  try { await navigator.clipboard.writeText(data); toast('Download indisponível aqui. Copiei o conteúdo para a área de transferência.'); }
  catch (e) { toast('Download indisponível nesta visualização.'); }
}
function importFile(file){
  const r = new FileReader();
  r.onload = async () => {
    let obj; try { obj = JSON.parse(r.result); } catch (e) { toast('Arquivo inválido: não é um JSON.'); return; }
    if (!obj || !Array.isArray(obj.tasks)) { toast('Arquivo inválido: falta a lista "tasks".'); return; }
    if (obj.config) { const c = normalizeConfig(obj.config); for (const k of Object.keys(CATS)) { const ids = new Set(S.config.subs[k].map(s=>s.id)); for (const s of c.subs[k]) if (!ids.has(s.id)) S.config.subs[k].push(s); } { const pids = new Set(S.config.people.map(x=>x.id)); for (const x of c.people) if (!pids.has(x.id)) S.config.people.push(x); } Store.saveConfig(); }
    let n = 0; for (const t of obj.tasks) { Store.saveTask(normalizeTask(t)); n++; if (S.mode === 'db' && n % 20 === 0) await new Promise(r => setTimeout(r, 300)); }
    toast(n + ' tarefas importadas.'); renderSettings();
  };
  r.readAsText(file);
}

  user:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',

    S.loaded = true; render(); emit();
  },
  persistLocal(){ if (S.mode === 'local' && !lsSet(LS_KEY, { config: S.config, cases: [...S.cases.values()] })) toast('Não consegui salvar neste navegador.'); },
  startDb(db){
    S.mode = 'db'; this.db = db; render();
    const timer = setTimeout(() => { if (!S.loaded) toast('O banco ainda não respondeu. Os casos aparecem quando a conexão voltar.'); }, 10000);
    db.collection('cases').onSnapshot(snap => {
      S.cases = new Map(snap.docs.map(d => [d.id, normalizeCase(d.data(), d.id)]));
      if (!snap.metadata.fromCache) { clearTimeout(timer); S.loaded = true; }
      render(); emit();
    }, err => { clearTimeout(timer); S.loaded = true; toast('Perdi a conexão com o banco (' + (err && err.code || 'erro') + '). Recarregue a página.'); render(); });
    db.doc('config/comite').onSnapshot(snap => { if (snap.exists) { S.config = normConfig(snap.data()); render(); emit(); } }, () => {});
  },
  queue(key, fn){
    const next = (this.chains.get(key) || Promise.resolve()).then(fn).catch(e => toast('Não consegui salvar (' + (e && e.code || 'erro') + ').'));
    this.chains.set(key, next); return next;
  },
  save(c){
    c.updatedAt = new Date().toISOString(); S.cases.set(c.id, c);
    if (S.mode === 'db') { const body = clone(c); delete body.id; this.queue('c:'+c.id, () => this.db.collection('cases').doc(c.id).set(body)); }
    else this.persistLocal();
    render(); emit();
  },
  remove(id){
    S.cases.delete(id);
    if (S.mode === 'db') this.queue('c:'+id, () => this.db.collection('cases').doc(id).delete()); else this.persistLocal();
    render(); emit();
  },
  saveConfig(){
    if (S.mode === 'db') this.queue('config', () => this.db.doc('config/comite').set(clone(S.config))); else this.persistLocal();
    render(); emit();
  }
};

/* render */
const cmp = (a,b) => a.order - b.order || a.createdAt.localeCompare(b.createdAt);
function render(){
  const tw = thisWeek(); const cd = committeeDate(tw); const today = todayISO();
  const next = cd >= today ? cd : committeeDate(addDays(tw,7));
  const dd = diffDays(next, today);
  $('#k-next-label').innerHTML = `Próximo comitê: <b class="num">${esc(shortDate(next))}</b> <span class="num" style="color:var(--faint)">(${dd === 0 ? 'hoje' : 'em ' + dd + ' d'})</span> ·`;
  $('#k-cfg-day').innerHTML = [1,2,3,4,5].map(d => `<option value="${d}" ${S.config.day===d?'selected':''}>${WEEKDAYS[d]}</option>`).join('');
  const pk = $('#k-pick-list'); if (pk) renderPicker();
  $$('[data-tab]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tab === UI.tab)));
  const st = $('#k-storage'); st.className = 'storage' + (S.mode === 'db' ? ' db' : '');
  st.querySelector('span').textContent = S.mode === 'db' ? (S.loaded ? 'Salvo na nuvem (privado)' : 'Carregando…') : S.mode === 'local' ? 'Salvo só neste navegador' : 'Conectando…';
  renderAlerts();
  if (UI.tab === 'hist') renderHist(); else renderBoard();
}
function renderStats(){
  const all = [...S.cases.values()]; const open = all.filter(pending);
  const in3 = open.filter(c => c.week && weekOffset(c.week) >= 0 && weekOffset(c.week) <= 2);
  const ready = in3.filter(c => readiness(c).full).length;
  const exp = in3.reduce((s,c) => s + (c.price || 0), 0);
  const backlog = open.filter(c => !c.week).length;
  const since = addDays(todayISO(), -89);
  const dec = all.filter(c => !pending(c) && c.decidedAt && isoOfStamp(c.decidedAt) >= since);
  const appr = dec.filter(c => c.decision === 'aprovado' || c.decision === 'ressalvas').length;

    <div class="stat"><span class="k">Proposta em pauta</span><span class="v">${exp ? fmtNum(exp,1) : '0'}</span><span class="d">R$ MM somados nas 3 semanas</span></div>
    <div class="stat"><span class="k">Aprovação 90 dias</span><span class="v">${dec.length ? Math.round(appr/dec.length*100) + '%' : '—'}</span><span class="d">${dec.length ? appr + ' de ' + dec.length + ' decididos' : 'Sem decisões registradas'}</span></div>`;

}
function cardHTML(c, idx){

    <div class="ready"><span class="num">${r.d}/${r.n}</span><div class="bar"><i class="${r.full ? 'full' : ''}" style="width:${pct}%"></i></div><span>${r.full ? 'Pronto' : 'Em preparo'}</span></div>

      <button type="button" class="mv" data-shift="${esc(c.id)}" data-by="-1" aria-label="Semana anterior" ${off === null || off <= 0 ? 'disabled style="opacity:.35"' : ''}>${ICON.left}</button>
      <button type="button" class="mv" data-shift="${esc(c.id)}" data-by="1" aria-label="${off === null ? 'Programar para essa semana' : 'Próxima semana'}">${ICON.right}</button></div>

function renderBoard(){

  const tw = thisWeek();

    const w = addDays(tw, off*7); const list = open.filter(c => c.week === w).sort(cmp);

        <div class="meta"><span class="num">${list.length} ${list.length===1?'caso':'casos'} · ${mins} min</span><span>${ready} ${ready===1?'pronto':'prontos'}</span><span style="flex:1"></span>${list.length ? `<button class="btn sm" type="button" data-agenda="${w}">${ICON.copy}Copiar pauta</button>` : ''}</div></div>

}
function renderHist(){
  const done = [...S.cases.values()].filter(c => !pending(c)).sort((a,b) => (b.decidedAt||'').localeCompare(a.decidedAt||''));
  if (!done.length) { $('#k-content').innerHTML = `<div class="empty">Nenhuma decisão registrada ainda. Abra um caso e use "Registrar decisão" depois do comitê.</div>`; return; }
  $('#k-content').innerHTML = `<div class="hist"><table><thead><tr><th>Decidido em</th><th>Caso</th><th>Decisão</th><th>Objetivo</th><th>Proposta</th><th>Observação</th></tr></thead><tbody>

/* mover */
function moveTo(id, week, beforeId){
  const c = S.cases.get(id); if (!c) return;
  c.week = week;
  const peers = [...S.cases.values()].filter(x => pending(x) && x.week === week && x.id !== id).sort(cmp);
  if (beforeId) { const i = peers.findIndex(x => x.id === beforeId); peers.splice(i < 0 ? peers.length : i, 0, c); }
  else peers.push(c);
  peers.forEach((x,i) => { if (x.order !== (i+1)*10 || x === c) { x.order = (i+1)*10; Store.save(x); } });
}
function shift(id, by){
  const c = S.cases.get(id); if (!c) return;
  const tw = thisWeek();
  let w;
  if (!c.week) w = by > 0 ? tw : '';
  else { const off = weekOffset(c.week); w = off + by < 0 ? (by < 0 ? '' : tw) : addDays(tw, (Math.max(off,0) + by) * 7); }
  moveTo(id, w);
}

/* pauta em texto */
function agendaText(w){
  const list = [...S.cases.values()].filter(c => pending(c) && c.week === w).sort(cmp);
  const lines = [`PAUTA COMITÊ · ${shortDate(committeeDate(w))}`, ''];
  list.forEach((c,i) => {
    lines.push(`${i+1}. ${c.name} · ${GOALS[c.goal]} · ${TYPES[c.type]} · ${c.minutes} min${c.presenter ? ' · apresenta ' + c.presenter : ''}`);
    const money = [c.face != null ? 'Face ' + mm(c.face) : '', c.price != null ? 'Proposta ' + mm(c.price) : '', c.face && c.price != null ? 'Deságio ' + Math.round((1 - c.price/c.face)*100) + '%' : '', c.rate].filter(Boolean).join(' | ');
    if (money) lines.push('   ' + money);
    if (c.counterparties) lines.push('   Credores/contrapartes: ' + c.counterparties);
    const r = readiness(c); if (!r.full) lines.push('   Pendente: ' + c.checklist.filter(x => !x.done).map(x => x.text).join('; '));
  });
  lines.push('', `Total: ${list.length} ${list.length===1?'caso':'casos'}, ${list.reduce((s,c) => s + c.minutes, 0)} min`);
  return lines.join('\n');
}
function showAgenda(w){
  const txt = agendaText(w);

}

  if (D.timer) flush();
  if (id) { const c = S.cases.get(id); if (!c) return; D.draft = clone(c); D.isNew = false; }
  else { D.draft = normalizeCase({ name: '' }); D.draft.name = ''; D.isNew = true; }
  D.id = D.draft.id; D.confirmDel = false; renderDrawer();
  if (D.isNew) setTimeout(() => $('#kf-name') && $('#kf-name').focus(), 30);

function schedule(){ clearTimeout(D.timer); const l = $('#k-saved-label'); if (l) l.textContent = 'Editando…'; D.timer = setTimeout(flush, 600); }
function flush(){
  clearTimeout(D.timer); D.timer = null; const d = D.draft; if (!d) return;
  if (!d.name.trim()) { if (D.isNew) return; d.name = S.cases.get(d.id)?.name || '(sem nome)'; }
  const cur = S.cases.get(d.id);
  if (!cur || JSON.stringify({...cur, updatedAt:0}) !== JSON.stringify({...d, updatedAt:0})) {
    if (D.isNew) { const peers = [...S.cases.values()].filter(x => pending(x) && x.week === d.week); d.order = (peers.reduce((m,x) => Math.max(m, x.order), 0) || 0) + 10; }
    Store.save(normalizeCase(d)); D.draft = clone(S.cases.get(d.id)); D.isNew = false;
  }
  const l = $('#k-saved-label'); if (l) l.textContent = 'Salvo';
  const calc = $('#k-calc'); if (calc) calc.innerHTML = calcHTML(D.draft);
}

function bindDrawer(){

  root.addEventListener('input', e => {
    const d = D.draft; if (!d) return; const el = e.target;
    const map = { 'kf-name': v => d.name = v.replace(/\n/g,' '), 'kf-presenter': v => d.presenter = v, 'kf-rate': v => d.rate = v, 'kf-cp': v => d.counterparties = v, 'kf-notes': v => d.notes = v, 'kf-link': v => d.link = v.trim(), 'kf-dnote': v => d.decisionNote = v, 'kf-face': v => d.face = parseNum(v), 'kf-price': v => d.price = parseNum(v) };
    if (map[el.id]) map[el.id](el.value);
    else if (el.dataset.chktext) { const x = d.checklist.find(x => x.id === el.dataset.chktext); if (x) x.text = el.value; }
    else return;
    schedule();
  });
  root.addEventListener('change', e => {
    const d = D.draft; if (!d) return; const el = e.target;
    if (el.id === 'kf-week') { if (D.isNew || !S.cases.has(d.id)) { d.week = el.value; flush(); return; } flush(); moveTo(d.id, el.value); D.draft = clone(S.cases.get(d.id) || d); return; }
    if (el.id === 'kf-goal') d.goal = el.value; else if (el.id === 'kf-type') d.type = el.value; else if (el.id === 'kf-min') d.minutes = +el.value; else return;
    flush();
  });
  root.addEventListener('keydown', e => {
    const d = D.draft; if (!d) return;
    if (e.target.id === 'kf-name' && e.key === 'Enter') { e.preventDefault(); flush(); }
    if (e.target.id === 'kf-chk-new' && e.key === 'Enter') { e.preventDefault(); const v = e.target.value.trim(); if (!v) return; d.checklist.push({ id: uid('c'), text: v, done: false }); flush(); renderDrawer(); $('#kf-chk-new').focus(); }
  });
  root.addEventListener('click', e => {
    const d = D.draft; if (!d) return; const t = e.target.closest('button,[data-close]'); if (!t) return;
    if (t.hasAttribute('data-close')) return closeDrawer();
    if (t.dataset.opentask) { const id = t.dataset.opentask; closeDrawer(); if (MN.openTask) MN.openTask(id); return; }
    if (t.dataset.chk) { const x = d.checklist.find(x => x.id === t.dataset.chk); if (x) x.done = !x.done; flush(); renderDrawer(); return; }
    if (t.dataset.chkdel) { d.checklist = d.checklist.filter(x => x.id !== t.dataset.chkdel); flush(); renderDrawer(); return; }
    if (t.dataset.decide) {
      const k = t.dataset.decide; const before = clone(S.cases.get(d.id) || d);
      if (k === 'adiar') { const base = d.week && weekOffset(d.week) >= 0 ? d.week : thisWeek(); d.week = addDays(base, 7); d.postponed = (d.postponed||0) + 1; d.decision = 'pending'; d.decidedAt = ''; flush(); toast('Adiado para o comitê de ' + shortDate(committeeDate(d.week)) + '.', { label: 'Desfazer', fn: () => Store.save(normalizeCase(before)) }); renderDrawer(); return; }
      if (k === 'pending') { d.decision = 'pending'; d.decidedAt = ''; if (!d.week || weekOffset(d.week) < 0) d.week = thisWeek(); }
      else { d.decision = k; d.decidedAt = new Date().toISOString(); }
      flush(); renderDrawer();
      if (k !== 'pending') toast('Decisão registrada: ' + DECISIONS[k][0] + '.', { label: 'Desfazer', fn: () => Store.save(normalizeCase(before)) });
      return;
    }
    if (t.id === 'k-del') { D.confirmDel = true; renderDrawer(); return; }
    if (t.id === 'k-del-no') { D.confirmDel = false; renderDrawer(); return; }
    if (t.id === 'k-del-yes') { const snap = clone(S.cases.get(d.id) || d); clearTimeout(D.timer); D.draft = null; D.id = null; $('#k-drawer-root').innerHTML = ''; Store.remove(snap.id); toast('Caso apagado.', { label: 'Desfazer', fn: () => Store.save(normalizeCase(snap)) }); }
  });
}

function toast(text, action){
  const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span>${esc(text)}</span>`;
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.onclick = () => { action.fn(); el.remove(); }; el.appendChild(b); }
  $('#toasts').appendChild(el); setTimeout(() => el.remove(), action ? 6000 : 2800);
}

function bind(){
  $('#k-btn-new').addEventListener('click', () => openDrawer(null));
  $$('[data-tab]').forEach(b => b.addEventListener('click', () => { UI.tab = b.dataset.tab; persistUI(); render(); }));
  $('#k-cfg-day').addEventListener('change', e => { S.config.day = +e.target.value; for (const [k,v] of Object.entries(S.config.overrides)) if (v === S.config.day) delete S.config.overrides[k]; Store.saveConfig(); toast('Padrão: comitê às ' + WEEKDAYS[S.config.day] + 's.'); });
  $('#k-btn-pick').addEventListener('click', openPicker);
  $('#k-content').addEventListener('change', e => {
    const s = e.target.closest('select.kday'); if (!s) return;
    const w = s.dataset.week, v = +s.value;
    if (v === S.config.day) delete S.config.overrides[w]; else S.config.overrides[w] = v;
    Store.saveConfig(); toast('Comitê da semana em ' + shortDate(committeeDate(w)) + '.');
  });
  const content = $('#k-content');
  document.addEventListener('click', e => {
    const mv = e.target.closest('[data-move]'); if (mv) { moveTo(mv.dataset.move, addDays(thisWeek(), +mv.dataset.to * 7)); return; }
    const op = e.target.closest('[data-open]'); if (op && !e.target.closest('.drawer')) { openDrawer(op.dataset.open); return; }
  });
  content.addEventListener('click', e => {
    const sh = e.target.closest('[data-shift]'); if (sh) { e.stopPropagation(); if (!sh.disabled) shift(sh.dataset.shift, +sh.dataset.by); return; }
    const ag = e.target.closest('[data-agenda]'); if (ag) { showAgenda(ag.dataset.agenda); return; }
    const c = e.target.closest('.card'); if (c) openDrawer(c.dataset.id);
  });
  content.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card')) { e.preventDefault(); openDrawer(e.target.dataset.id); } });
  content.addEventListener('dragstart', e => { const c = e.target.closest('.card'); if (!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
  content.addEventListener('dragend', () => { $$('.dragging').forEach(x => x.classList.remove('dragging')); $$('.col.over').forEach(x => x.classList.remove('over')); });
  content.addEventListener('dragover', e => { const col = e.target.closest('.col[data-week]'); if (!col || col.dataset.week === 'later') return; e.preventDefault(); $$('.col.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); });
  content.addEventListener('drop', e => {
    const col = e.target.closest('.col[data-week]'); if (!col || col.dataset.week === 'later') return; e.preventDefault();
    const id = e.dataTransfer.getData('text/plain'); const over = e.target.closest('.card');
    moveTo(id, col.dataset.week, over && over.dataset.id !== id ? over.dataset.id : null);
  });
  $('#k-modal-root').addEventListener('click', async e => {
    if (e.target.matches('.scrim,.modal') || e.target.closest('button[data-mclose]')) { $('#k-modal-root').innerHTML = ''; return; }
    const pb = e.target.closest('[data-pick]');
    if (pb) { const t = MN.tasks && MN.tasks().get(pb.dataset.pick); if (t) { const c = addFromTask(t, $('#k-pick-week').value); toast('"' + c.name + '" na pauta: ' + caseLabel(c) + '.'); renderPicker(); } return; }
    if (e.target.closest('#k-agenda-copy')) {
      const ta = $('#k-agenda-txt');
      try { await navigator.clipboard.writeText(ta.value); toast('Pauta copiada.'); }
      catch (err) { ta.focus(); ta.select(); toast('Texto selecionado. Use Ctrl+C ou Copiar do celular.'); }
    }
  });
  $('#k-modal-root').addEventListener('input', e => { if (e.target.id === 'k-pick-q') renderPicker(); });
  document.addEventListener('keydown', e => { if (location.hash !== '#comite') return; if (e.key === 'Escape') { if ($('#k-modal-root').innerHTML) $('#k-modal-root').innerHTML = ''; else if (D.draft) closeDrawer(); } });
  let last = thisWeek(); setInterval(() => { const w = thisWeek(); if (w !== last) { last = w; render(); } }, 60000);
}

function caseLabel(c){ return c.week ? 'comitê de ' + shortDate(committeeDate(c.week)) : 'a programar'; }
function weekChoices(){ const tw = thisWeek(); return [['', 'A programar'], ...COLS.map(([off,label]) => { const w = addDays(tw, off*7); return [w, label + ' · ' + shortDate(committeeDate(w))]; })]; }
function addFromTask(t, week){
  const m = t.title.match(/^(.{2,60}?)\s+[-–]\s+(.+)$/);
  const peers = [...S.cases.values()].filter(x => pending(x) && x.week === week);
  const c = normalizeCase({ name: m ? m[1].trim() : t.title, notes: [m ? m[2].trim() : '', t.notes].filter(Boolean).join('\n'), week, taskId: t.id, order: peers.reduce((mx,x) => Math.max(mx, x.order), 0) + 10, createdAt: new Date().toISOString() });
  Store.save(c); return c;
}
function openPicker(){
  $('#k-modal-root').innerHTML = `<div class="scrim" data-mclose></div><div class="modal" data-mclose><div class="box" role="dialog" aria-modal="true" aria-label="Trazer do Afazeres">
    <div style="display:flex;align-items:center;gap:8px"><b style="flex:1;font-size:17px">Trazer tarefas do Afazeres</b><button class="btn ghost" type="button" data-mclose aria-label="Fechar">${ICON.x}</button></div>
    <div class="grid2"><div class="field"><label for="k-pick-week">Levar para</label><select id="k-pick-week" class="inp">${weekChoices().map(([v,l]) => `<option value="${v}" ${v===thisWeek()?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
    <div class="field"><label for="k-pick-q">Buscar tarefa</label><input id="k-pick-q" class="inp" placeholder="Nome do caso ou parte do texto"></div></div>
    <div id="k-pick-list" class="pick"></div></div></div>`;
  renderPicker(); setTimeout(() => $('#k-pick-q') && $('#k-pick-q').focus(), 30);
}
function renderPicker(){
  const box = $('#k-pick-list'); if (!box) return;
  const tasks = MN.tasks ? [...MN.tasks().values()] : [];
  const linked = new Set([...S.cases.values()].filter(pending).map(c => c.taskId).filter(Boolean));
  const q = ($('#k-pick-q')?.value || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  const list = tasks.filter(t => t.status !== 'done' && !linked.has(t.id) && (!q || (t.title + ' ' + t.notes).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q)))
    .sort((a,b) => (a.cat === b.cat ? 0 : a.cat === 'invista' ? -1 : 1) || a.priority - b.priority || a.title.localeCompare(b.title)).slice(0, 80);
  box.innerHTML = list.length ? list.map(t => `<div class="pick-row"><span class="dot ${t.cat}"></span><span class="pick-t">${esc(t.title)}<small>${esc(MN.subName ? MN.subName(t) : '')}</small></span><button class="btn sm" type="button" data-pick="${esc(t.id)}">Pautar</button></div>`).join('')
    : `<p class="help">${tasks.length ? 'Nenhuma tarefa aberta encontrada (as que já estão na pauta não aparecem).' : 'O Afazeres ainda não carregou as tarefas.'}</p>`;
}
MN.comite = {
  caseForTask: id => [...S.cases.values()].find(c => c.taskId === id && pending(c)) || null,
  label: caseLabel, weekChoices, thisWeek,
  addFromTask, open: id => { location.hash = 'comite'; setTimeout(() => openDrawer(id), 0); },
  count: () => [...S.cases.values()].filter(c => pending(c) && c.week && weekOffset(c.week) >= 0 && weekOffset(c.week) <= 2).length
};
bind(); bindDrawer(); render(); Store.start();
})();
</script>
